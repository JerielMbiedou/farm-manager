# Render Blueprint
# Doc: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ferme-mbiedou
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build && pnpm run db:migrate
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ferme-mbiedou-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SEED_DEMO_DATA
        value: "false"

databases:
  - name: ferme-mbiedou-db
    plan: free
    region: frankfurt
    databaseName: ferme_mbiedou
    user: ferme
