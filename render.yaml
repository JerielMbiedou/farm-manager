# Render Blueprint
# Doc: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ferme-mbiedou
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build && pnpm run db:migrate
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Base de données Neon : la valeur se règle à la main dans le tableau de
      # bord Render et n'est jamais écrasée par ce fichier. Un lien
      # « fromDatabase » recréait une base Render vide à chaque synchronisation.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: SEED_DEMO_DATA
        value: "false"
