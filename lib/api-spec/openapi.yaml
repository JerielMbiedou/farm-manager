openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API for Ferme Familiale - Gestion de la ferme avicole
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: financement
    description: Gestion du financement
  - name: devis
    description: Devis de construction
  - name: depenses
    description: Suivi des dépenses de construction
  - name: bandes
    description: Gestion des bandes de poulets
  - name: dashboard
    description: Tableau de bord

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Connexion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Identifiants incorrects
          content:
            application/json:
              schema:
