components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, investisseur, gestionnaire]
        nom:
          type: string
      required:
        - id
        - username
        - role
        - nom

    Financement:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        montant:
          type: number
        date:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nom
        - montant
        - date
        - createdAt

    CreateFinancementBody:
      type: object
      properties:
        nom:
          type: string
